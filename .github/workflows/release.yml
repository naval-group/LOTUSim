name: Release container image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release-nix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # naval-group is read-only here: ci.yml builds and pushes the same .#container.
      # A substituter needs no token, so no write path reaches the publishing workflow.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://ros.cachix.org https://naval-group.cachix.org
            extra-trusted-public-keys = ros.cachix.org-1:dSyZxI8geDCJrwgvCOHDoAfOm5sV1wCPjBkKL+38Rvo= naval-group.cachix.org-1:ytTEzFEeuzQrC9IRYLzHGa5OnM65G95M6/sbPd0fy28=

      - name: Normalize repository name (lowercase)
        id: repo
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push the image
        id: image
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The default shell is bash -e without pipefail, so a failing
          # skopeo login would otherwise be masked by the pipe.
          set -euo pipefail

          nix build .#container --print-build-logs
          ./result > "$RUNNER_TEMP/lotusim.tar"

          # skopeo comes from this flake's own nixpkgs, so the tool that
          # publishes the image is pinned like the image itself.
          nix build --inputs-from . nixpkgs#skopeo -o "$RUNNER_TEMP/skopeo"
          export PATH="$RUNNER_TEMP/skopeo/bin:$PATH"
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/auth.json"

          printf '%s' "$REGISTRY_PASSWORD" | skopeo login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

          registry="ghcr.io/${{ steps.repo.outputs.repo }}"

          # A tag push re-publishes a commit main already tagged with its short
          # sha, so the version name is the only tag it adds.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags=("$GITHUB_REF_NAME")
          else
            tags=("${GITHUB_SHA::7}" latest)
          fi

          skopeo copy --digestfile "$RUNNER_TEMP/digest" \
            "docker-archive:$RUNNER_TEMP/lotusim.tar" \
            "docker://$registry:${tags[0]}"

          # Copying registry-side keeps every tag on the one digest cosign signs.
          for t in "${tags[@]:1}"; do
            skopeo copy "docker://$registry:${tags[0]}" "docker://$registry:$t"
          done

          # cosign signs a digest, not a tag.
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0
        with:
          cosign-release: 'v2.6.2'

      - name: Sign container image
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # cosign reads ~/.docker/config.json, not skopeo's REGISTRY_AUTH_FILE.
          printf '%s' "$REGISTRY_PASSWORD" | cosign login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

          cosign sign --yes \
            ghcr.io/${{ steps.repo.outputs.repo }}@${{ steps.image.outputs.digest }}

  # The developer image: Ubuntu with the toolchain, source and a built
  # workspace, set up through apt and the lotusim script (Dockerfile.dev).
  # The Nix image cannot stand in for it: it holds only the lotusim closure
  # plus bash and coreutils, with no FHS layout, package manager, compiler,
  # colcon or source to develop against.
  # Published as <repo>-dev so its tags never collide with the Nix image's.
  release-dev:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-dev"
          # Same scheme as the Nix image: a version tag on tag pushes, the
          # short sha plus latest on main.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="$image:$GITHUB_REF_NAME"
          else
            tags="$image:${GITHUB_SHA::7},$image:latest"
          fi
          echo "image=$image" >> $GITHUB_OUTPUT
          echo "tags=$tags" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0
        with:
          cosign-release: 'v2.6.2'

      - name: Sign container image
        run: |
          cosign sign --yes \
            ${{ steps.meta.outputs.image }}@${{ steps.image.outputs.digest }}
