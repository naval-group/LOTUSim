name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          # The Gazebo Harmonic vendor stack is not in cache.nixos.org. Without
          # this the job builds ~370 derivations from source — roughly an hour —
          # and reports neither an error nor a warning while doing it.
          extra_nix_config: |
            extra-substituters = https://ros.cachix.org
            extra-trusted-public-keys = ros.cachix.org-1:dSyZxI8geDCJrwgvCOHDoAfOm5sV1wCPjBkKL+38Rvo=

      # No pushFilter: it applies before closure expansion, so it cannot keep the Gazebo
      # stack out. The post-build hook already limits this to the paths CI builds.
      # main only: `on: push` has no branch filter, and a branch's paths are never
      # collected once it is deleted.
      - uses: cachix/cachix-action@v17
        if: github.ref == 'refs/heads/main'
        with:
          name: naval-group
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build the workspace
        run: nix build .#lotusim --print-build-logs

      - name: Build the container image
        run: |
          set -euo pipefail
          nix build .#container --print-build-logs
          # The build only produces the streaming script, so assemble the image
          # too — discarded rather than loaded, which keeps the runner's disk out
          # of it while still exercising the layering.
          ./result > /dev/null
