name: CI

on:
  push:
  pull_request:

jobs:
  nix-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          # The Gazebo Harmonic vendor stack is not in cache.nixos.org. Without
          # this the job builds ~370 derivations from source — roughly an hour —
          # and reports neither an error nor a warning while doing it.
          extra_nix_config: |
            extra-substituters = https://ros.cachix.org
            extra-trusted-public-keys = ros.cachix.org-1:dSyZxI8geDCJrwgvCOHDoAfOm5sV1wCPjBkKL+38Rvo=

      # No pushFilter: it applies before closure expansion, so it cannot keep the Gazebo
      # stack out. The post-build hook already limits this to the paths CI builds.
      # extraPullNames carries ros: this action rewrites NIX_USER_CONF_FILES, which drops
      # the substituter set above, and the ROS stack then compiles from source and lands
      # in this cache.
      - uses: cachix/cachix-action@v17
        with:
          name: naval-group
          extraPullNames: ros
          authToken: "${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}"


      - name: Build the workspace
        run: nix build .#lotusim --print-build-logs

      # Nix will generate the hash from the input libraries and UI code.
      # If there is a hash change, it will test build
      - name: Build the UI
        run: |
          set -euo pipefail
          ui=$(nix eval --raw .#ui.outPath)
          if nix path-info --store https://naval-group.cachix.org "$ui" >/dev/null 2>&1; then
            echo "Already in naval-group: $ui"
          else
            nix build .#ui --print-build-logs
          fi

      # Separate derivation from `workspace` (see flake.nix), so this rebuilds
      # the workspace with BUILD_TESTING=ON and runs colcon test, rather than
      # reusing the step above — a failing test here does not block the
      # container image build below.
      - name: Run package tests
        run: nix build .#checks.x86_64-linux.default --print-build-logs

      - name: Build the container image
        run: |
          set -euo pipefail
          nix build .#container --print-build-logs
          # The build only produces the streaming script, so assemble the image
          # too — discarded rather than loaded, which keeps the runner's disk out
          # of it while still exercising the layering.
          ./result > /dev/null

      # Nothing above pulls xdyn in, and nix flake check would not either: it builds only
      # checks.*, and this flake declares none. Without this the dependency is untested.
      - name: The devShell resolves xdyn
        run: nix develop --command xdyn-for-cs --help

  # The apt toolchain, kept alongside Nix: installs ROS and Gazebo from apt.
  apt-build:
    runs-on: ubuntu-24.04

    env:
      LOTUSIM_WS: ${{ github.workspace }}
      LOTUSIM_PATH: ${{ github.workspace }}/src/LOTUSim

    steps:
      - uses: actions/checkout@v4
        with:
          path: src/LOTUSim

      - name: Install dependencies and build with apt
        run: bash "$LOTUSIM_PATH/scripts/lotusim" install_lotus

  # Branch protection can only require checks by name; it has no "every job
  # passed" option. So this job is the single required check: jobs can be
  # renamed or added here, listed in needs, without touching the repository
  # settings.
  ci-success:
    if: always()
    needs: [nix-build, apt-build]
    runs-on: ubuntu-latest

    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
