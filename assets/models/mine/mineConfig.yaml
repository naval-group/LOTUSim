rotations convention: [psi, theta', phi'']

environmental constants:
  g: {value: 9.81, unit: m/s^2}
  rho: {value: 1025, unit: kg/m^3}
  nu: {value: 1.18e-6, unit: m^2/s}

environment models:
  - model: no wind
  - model: no waves
    constant sea elevation in NED frame: {value: 0, unit: m}
  - model: ekman current
    #seabed depth: 123
    seabed file: seabed/seabed.png
    latitude: { value: 43, unit: deg }
    top layer thickness: { value: 5, unit: m}
    bottom layer thickness: { value: 8, unit: m}
    current velocity: { value: 0.1, unit: m/s }
    current orientation: { value: 0, unit: deg }
    U10: { value: 1, unit: m/s }
    wind orientation: { value: 0, unit: rad }

bodies:   
  - name: floating_cube
    mesh: mine/meshes/mine.stl

    position of body frame relative to mesh:
      frame: mesh
      x: {value: 0.0, unit: m}
      y: {value: 0.0, unit: m}
      z: {value: 0.0, unit: m}
      phi: { value: 0, unit: rad }
      theta: { value: 0, unit: rad }
      psi: { value: 0, unit: rad }

    initial position of body frame relative to NED:
      frame: NED
      x: {value: 0.0, unit: m}
      y: {value: 0.0, unit: m}
      z: {value: 0.0, unit: m}
      phi: { value: 0, unit: deg }
      theta: { value: 0, unit: deg }
      psi: { value: 0, unit: deg }

    initial velocity of body frame relative to NED:
      frame: body
      u: { value: 0, unit: m/s }
      v: { value: 0, unit: m/s }
      w: { value: 0, unit: m/s }
      p: { value: 0, unit: rad/s }
      q: { value: 0, unit: rad/s }
      r: { value: 0, unit: rad/s }

    dynamics:
      # Matches "centre of inertia" below: with no gravity/hydrostatic force
      # model on this drift-only prop (see the <external forces> note
      # further down), there is no restoring moment, so an offset here
      # between the damping force's application point and the CoG creates a
      # torque with nothing to counteract it -- a slow, steady tilt that
      # never settles back to level (mild here given the mine's large
      # rotational inertia, but the same mismatch made wamv.yaml corkscrew
      # itself underwater within a minute).
      hydrodynamic forces calculation point in body frame:
        x: { value: 1.0, unit: m }
        y: { value: 0, unit: m }
        z: { value: 0, unit: m }

      centre of inertia:
        frame: floating_cube
        x: {value: 1.0, unit: m}
        y: {value: 0.0, unit: m}
        z: {value: 0.0, unit: m}

      rigid body inertia matrix at the center of gravity and projected in the body frame:
        frame: body
        row 1: [1E3, 0, 0, 0, 0, 0]
        row 2: [0, 1E3, 0, 0, 0, 0]
        row 3: [0, 0, 1E3, 0, 0, 0]
        row 4: [0, 0, 0, 1E3, 0, 0]
        row 5: [0, 0, 0, 0, 1E3, 0]
        row 6: [0, 0, 0, 0, 0, 1E3]

      added mass matrix at the center of gravity and projected in the body frame:
        frame: body
        row 1: [40, 0, 0, 0, 0, 0]
        row 2: [0, 40, 0, 0, 0, 0]
        row 3: [0, 0, 40, 0, 0, 0]
        row 4: [0, 0, 0, 40, 0, 0]
        row 5: [0, 0, 0, 0, 40, 0]
        row 6: [0, 0, 0, 0, 0, 40]

    external forces:
      # Only a drag term, no gravity/hydrostatic: this is a "drift-only" prop
      # (see mine_drift_only.json) meant to demonstrate current advection, not
      # a physically-calibrated hull. Without ANY external force the body's
      # relative velocity to the ekman current above never turns into a force
      # -- it just sits at its spawn pose forever, current or not. Linear
      # damping against the body's velocity relative to the current is what
      # makes it accelerate up to drifting at the current's speed; time
      # constant tau = mass/damping ~= 1040/70 ~= 15 s, the same settling-time
      # convention as fremmConfig.yaml's own damping (tau ~= mass/damping).
      - model: linear damping
        damping matrix at the center of gravity projected in the body frame:
          frame: floating_cube
          row 1: [70, 0, 0, 0, 0, 0]
          row 2: [0, 70, 0, 0, 0, 0]
          row 3: [0, 0, 70, 0, 0, 0]
          row 4: [0, 0, 0, 1E3, 0, 0]
          row 5: [0, 0, 0, 0, 1E3, 0]
          row 6: [0, 0, 0, 0, 0, 1E3]
